name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download invitation artwork
        run: |
          mkdir -p site/assets
          base="https://tilda-2020123-copy.mashrapov.chatgpt.site/invitation"
          for file in floral-80.png scene1.png scene2.png scene3.png scene4.png scene5.png scene6.png; do
            curl --fail --location --retry 3 "$base/$file" --output "site/assets/$file"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

